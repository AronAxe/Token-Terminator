# Merge into the target profile; preserve existing enabled plugins/toolsets.
# Install the v0.10.0 review build and run `token-terminator install-context-engine` first.
plugins:
  enabled:
    - token-terminator
context:
  engine: token-terminator
# Restricted toolset profiles must also permit `context_engine`.
# Existing environment, not a new key model:
# TOKEN_TERMINATOR_MODE=balanced
# TOKEN_TERMINATOR_JEV=true
# TOKEN_TERMINATOR_CONTEXT_IR=true
# TOKEN_TERMINATOR_ENGINE_MAX_BATCHES=2
# TOKEN_TERMINATOR_ENGINE_PROTECT_LAST=6
# TOKEN_TERMINATOR_ENGINE_REGION_CHARS=8000
# TOKEN_TERMINATOR_ENGINE_RECALL_SOURCES=3
# TOKEN_TERMINATOR_ENGINE_SEARCH_SOURCES=10000
# Reuse OPENROUTER_API_KEY or TYPESAFE_API_KEY; do not put credentials here.
