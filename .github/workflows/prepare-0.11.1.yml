name: Prepare approved v0.11.1 metadata

on:
  push:
    branches: [fix/hermes-live-compression-compat]
    paths: [.github/workflows/prepare-0.11.1.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/fix/hermes-live-compression-compat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update only release metadata and documentation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/hermes-live-compression-compat
          git merge-base --is-ancestor 58b6d6c2af2b9014bce658caf2f6fb0119d0f759 HEAD
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              'README.md': '060d1c08b33ac27fa3e0c455d08472296a0ecf1e46ef8b83cd7b634163531a18',
              'MIGRATION.md': 'd0f08d6ce668d045e90aa78ed91223749722797939624e63fcac5239e75f23b4',
              'CHANGELOG.md': '81dac26dc60aaa244ec1c9a61907c8d5cba77ad0e958b3cb00ef5e818a5ea93e',
              'pyproject.toml': '0a4fa5081dde2a87cf02adf00c67238b1d6d5dbdbe298a8d85949b38f1710daf',
              'src/rtk_hermes_plus/_version.py': 'ada32ef5703d2448ef7684e616a70ec3baa1257db8ad80cfed7992e7d4c03be4',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name

          def write(name, text):
              Path(name).write_bytes(text.encode('utf-8'))

          for name in ('pyproject.toml', 'Cargo.toml', 'src/rtk_hermes_plus/_version.py'):
              text = Path(name).read_text(encoding='utf-8')
              assert text.count('"0.11.0"') == 1, name
              write(name, text.replace('"0.11.0"', '"0.11.1"'))

          readme = Path('README.md').read_text(encoding='utf-8')
          for old, new in (
              ('releases/tag/v0.11.0', 'releases/tag/v0.11.1'),
              ('alt="Release v0.11.0"', 'alt="Release v0.11.1"'),
              ('badge/release-v0.11.0-', 'badge/release-v0.11.1-'),
              ('badge/crates.io-v0.11.0-', 'badge/crates.io-v0.11.1-'),
              ('Token-Terminator.git@v0.11.0', 'Token-Terminator.git@v0.11.1'),
              ('Install **v0.11.0**', 'Install **v0.11.1**'),
              ('Token Terminator 0.11.0 builds on', 'Token Terminator 0.11.1 builds on'),
              ('commands below pin the `v0.11.0` release tag', 'commands below pin the `v0.11.1` release tag'),
              ('cargo add token-terminator@0.11.0', 'cargo add token-terminator@0.11.1'),
          ):
              assert old in readme, old
              readme = readme.replace(old, new)
          old = "No. Token Terminator operates after or alongside normal context assembly. It does not own the transcript, alter persisted conversation history, or require a particular memory engine."
          assert old in readme
          readme = readme.replace(old, "It can replace the selected **Hermes context engine**, including LCM, when explicitly configured with `context.engine: token-terminator`. Middleware-only mode keeps the host engine upstream. Neither mode replaces the memory system or transcript store, or destructively rewrites persisted conversation history.")
          note = '''## Patch v0.11.1: Hermes live-compression compatibility

          Repairs the missing `_coerce_threshold_tokens_cap` adapter method and live
          window/threshold invalidation. The selected TT engine now follows Hermes'
          current route budget and isolates cloned engine settings. No new settings,
          generative summarizer or relaxed tokenizer gate are introduced.

          For managed/multiplex installs, upgrade the environment that actually imports
          TT, then restart the appropriate idle backend through its normal supervisor.
          This patch does not add unknown-model tokenizer mappings or fix Hermes' separate
          concurrent plugin-discovery race. [Patch notes](docs/releases/v0.11.1.md) ·
          [Compatibility details](docs/LIVE_COMPRESSION_COMPAT.md).

          '''
          # Triple-quoted text is indented only for the workflow's Python block.
          import textwrap
          readme = readme.replace('## New in v0.11.0\n', textwrap.dedent(note) + '## New in v0.11.0\n', 1)
          write('README.md', readme)

          entry = '''## 0.11.1 - 2026-10-04

          - Fixed the Hermes live-compression adapter's missing `_coerce_threshold_tokens_cap`
            method and lazy context-window/threshold cache invalidation.
          - Reused installed Hermes route metadata and per-model threshold handling; current
            `select_context` budgets refresh the window without resetting retry/usage state.
          - Preserved independent cloned-engine configuration, exact recovery, internal-call
            isolation and the existing strict tokenizer acceptance gate.
          - Added nine real-Hermes regression cases and corrected their Ruff formatting.
          - Updated release/install references and corrected the README's stale context-engine
            FAQ. Rust companion version aligned; its runtime behavior is unchanged.
          - Unknown-model tokenizers and the host's plugin-discovery race remain separate
            limitations; publication does not install or restart a running Hermes profile.

          '''
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          assert changelog.startswith('# Changelog\n\n')
          write('CHANGELOG.md', '# Changelog\n\n' + textwrap.dedent(entry) + changelog[len('# Changelog\n\n'):])

          migration = '''# Migration to Token Terminator 0.11.1

          ## 0.11.0 to 0.11.1

          This is the PR #20 Hermes live-compression compatibility repair. No new key,
          database migration, tokenizer override or engine-selection change is required.
          Upgrade the environment actually used by the managed Hermes launcher, not an
          unrelated Python environment or stale venv copy:

          ```bash
          python -m pip install --upgrade 'git+https://github.com/AronAxe/Token-Terminator.git@v0.11.1'
          python -m rtk_hermes_plus.cli install-context-engine
          ```

          Confirm the imported `rtk_hermes_plus` path in that environment. When the relevant
          backend is idle, restart it once through its normal supervisor; do not start a
          competing gateway or delete histories/vaults. Verify the loaded version and
          current-model request metrics. A healthy restart or a lower UI percentage alone
          does not prove reduction. Unknown target tokenizers still bypass the engine.
          See [the compatibility guide](docs/LIVE_COMPRESSION_COMPAT.md). These instructions
          do not imply publication performs a live installation or restart.

          ---

          '''
          write('MIGRATION.md', textwrap.dedent(migration) + Path('MIGRATION.md').read_text(encoding='utf-8'))

          compat = Path('docs/LIVE_COMPRESSION_COMPAT.md').read_text(encoding='utf-8')
          start = compat.index('Operational state:')
          end = compat.index('The observed host directory loader', start)
          compat = compat[:start] + '''Release scope: v0.11.1 publishes PR #20's adapter and tests. Earlier incident
          deployment notes are historical; a separately deployed adapter snapshot is not
          proof that this exact release has loaded in a running process. Installation,
          engine discovery and actual current-model request reduction remain separate
          checks. This release performs no live installation or backend restart.

          '''.replace('\n          ', '\n') + compat[end:]
          compat += '\nUnknown target tokenizers still cause ContextEngine/IR to pass through. This\npatch does not supply new tokenizer mappings, guess a replacement model window,\nor guarantee a reduction in a live session.\n'
          write('docs/LIVE_COMPRESSION_COMPAT.md', compat)

          notes = '''# Token Terminator v0.11.1 — Hermes live-compression compatibility

          A focused patch release of PR #20. The v0.11.0 ContextEngine, learned JEV policy,
          Context IR, exact-evidence vault and Observatory remain in place.

          ## Fixed

          - Supply `_coerce_threshold_tokens_cap` for Hermes' live-compression configuration.
          - Honor invalidated context-window and threshold caches, explicit pin removal,
            current-route metadata and per-model threshold handling.
          - Refresh the engine window from the host's current `select_context` budget
            without resetting retry bindings or usage counters.
          - Keep cloned engines' settings independent. No generative compressor, destructive
            history truncation, new key or weakened tokenizer gate is introduced.
          - Include nine real-Hermes regression cases and the formatting-only CI correction.

          ## Upgrade

          Use the Python environment actually loaded by your managed Hermes launcher:

          ```bash
          python -m pip install --upgrade 'git+https://github.com/AronAxe/Token-Terminator.git@v0.11.1'
          python -m rtk_hermes_plus.cli install-context-engine
          ```

          Keep your existing plugin/engine selection and JEV settings. Once idle, restart
          only the relevant backend through its normal supervisor. Do not delete the
          conversation history or evidence vault. Verify the imported package path,
          loaded version and current-model request metrics, not only a UI percentage.

          ## Validation and scope

          The formatted PR candidate passed Python 3.10–3.13, Windows, packaging, Rust,
          learned-policy, ContextEngine, dashboard and Context IR workflows before release
          preparation. The learning artifact reported 611 passed and three skips; one
          skip is the whole optional real-Hermes test module. Its nine cases were previously
          run locally against installed Hermes `188a1a5` on Python 3.14, not counted as
          executed in that learning job. Final release-head CI status is recorded on PR #20.
          No paid inference or new performance/answer-quality claims accompany this patch.

          **Not fixed by this patch:** unknown-model tokenizer support and the separate
          host plugin-discovery race. Without an exact target tokenizer, ContextEngine/IR
          still pass through. This is not a guarantee that an affected live session has
          shrunk, and it does not merge the separate deployed-adapter branch.

          README changes are limited to a compatibility note, current install/version
          references and correcting the stale FAQ: explicitly selected TT can replace LCM
          as Hermes' ContextEngine. Artwork and schematics are unchanged.

          The Rust interoperability companion is version-aligned to 0.11.1 without a Rust
          behavior change; it is not the Python runtime. GitHub assets include the wheel,
          source distribution and SHA256SUMS. Existing releases remain unchanged.
          Publication does not install, configure or restart your running agents.

          [PR #20](https://github.com/AronAxe/Token-Terminator/pull/20) ·
          [Compatibility guide](https://github.com/AronAxe/Token-Terminator/blob/v0.11.1/docs/LIVE_COMPRESSION_COMPAT.md) ·
          [Migration](https://github.com/AronAxe/Token-Terminator/blob/v0.11.1/MIGRATION.md)
          '''
          notes = textwrap.dedent(notes)
          Path('docs/releases').mkdir(exist_ok=True)
          assert not Path('docs/releases/v0.11.1.md').exists()
          write('docs/releases/v0.11.1.md', notes)

          for name in ('README.md', 'MIGRATION.md', 'CHANGELOG.md'):
              text = Path(name).read_text(encoding='utf-8')
              assert '0.11.1' in text
          for name in expected:
              print(name, hashlib.sha256(Path(name).read_bytes()).hexdigest())
          PY
          git diff --check
          git diff --exit-code 58b6d6c2af2b9014bce658caf2f6fb0119d0f759 -- src/rtk_hermes_plus/hermes_engine.py tests scripts benchmarks docs/assets
          git add src/rtk_hermes_plus/_version.py pyproject.toml Cargo.toml README.md MIGRATION.md CHANGELOG.md docs/LIVE_COMPRESSION_COMPAT.md docs/releases/v0.11.1.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: prepare v0.11.1 Hermes compatibility patch'
          git push origin HEAD:refs/heads/fix/hermes-live-compression-compat
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
