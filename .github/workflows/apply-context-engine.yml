name: Apply verified ContextEngine candidate

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths:
      - .github/tt-transfer/**
      - .github/workflows/apply-context-engine.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/feat/hermes-context-engine-v0.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply locally tested source tree to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/hermes-context-engine-v0.10.0
          git merge-base --is-ancestor b87969b42e02fcdd119fe8d3dce12e8ede3fac6b HEAD
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('.github/tt-transfer').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i}.b64' for i in range(9)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '517f7c90554e2f9b83db04091e5f86aacc2ef8d67cfcb98cc87b09c1b75d96f2'
          pathlib.Path('/tmp/tt-context-engine.patch').write_bytes(patch)
          PY
          git apply --index /tmp/tt-context-engine.patch
          git rm -r .github/tt-transfer .github/workflows/apply-context-engine.yml .github/workflows/context-engine-dev-bundle.yml
          test "$(git write-tree)" = d54a0cecc05be2ea3f3f54b2c51f58349c184e2e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: selectable exact-history Hermes ContextEngine for v0.10.0'
          git push origin HEAD:refs/heads/feat/hermes-context-engine-v0.10.0
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
