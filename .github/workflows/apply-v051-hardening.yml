name: Apply v0.5.1 hardening

on:
  push:
    branches: [v0.5.1-hardening]

permissions:
  contents: write

concurrency:
  group: apply-v051-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.1-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy

      - name: Repair one-shot patcher
        run: python scripts/fix_v051_patcher.py

      - name: Apply hardening patch
        run: python scripts/apply_v051_hardening.py

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Normalize generated Python
        run: |
          python -m ruff check . --fix
          python -m ruff format .

      - name: Python lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Python tests
        run: python -m pytest

      - name: Python package verification
        run: |
          python scripts/benchmark.py --skip-rtk
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py 'dist/*'

      - name: Rust verification
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
          rm -f Cargo.lock
          cargo publish --dry-run

      - name: Remove one-shot machinery and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_v051_hardening.py scripts/fix_v051_patcher.py .github/workflows/apply-v051-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Token Terminator v0.5.1 hardening'
          git push origin HEAD:v0.5.1-hardening
