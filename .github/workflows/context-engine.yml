name: ContextEngine verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Hermes contract (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 801a9022a742562a3c4578c0d8dd12cfd393fc47
          - label: scope-audit
            ref: 5458de948379badc5b84ba624dc029367a28ece4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: upstream-hermes
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install tested API surface dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install openai python-dotenv rich fire tenacity pyyaml truststore croniter snowballstemmer tomli-w 'ruamel.yaml==0.18.16' prompt-toolkit
      - name: Real pinned-Hermes engine and call-scope contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream-hermes
        run: python scripts/smoke_hermes_context_engine.py > hermes-engine-smoke.json
      - name: Offline exact-history and call-scope regression tests
        run: python -m pytest tests/test_history_engine.py tests/test_async_runtime.py tests/test_call_scope.py --junitxml=context-engine-tests.xml
      - name: Bounded four-arm comparison
        run: python scripts/benchmark_context_engine.py --repeats 3 --output context-engine-results.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: context-engine-verification-${{ matrix.label }}
          path: |
            hermes-engine-smoke.json
            context-engine-tests.xml
            context-engine-results.json
          retention-days: 14
