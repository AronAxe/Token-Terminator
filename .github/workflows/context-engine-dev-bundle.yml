name: ContextEngine development bundle

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths: [.github/workflows/context-engine-dev-bundle.yml]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev-bundle
          git archive b87969b42e02fcdd119fe8d3dce12e8ede3fac6b | gzip > dev-bundle/baseline.tar.gz
          python -c "import tarfile; t=tarfile.open('dev-bundle/baseline.tar.gz'); assert 'pyproject.toml' in t.getnames()"
      - uses: actions/upload-artifact@v6
        with:
          name: context-engine-source-bundle
          path: dev-bundle/
          retention-days: 1
