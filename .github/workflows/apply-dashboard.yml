name: Apply verified dashboard candidate

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths:
      - .github/tt-dashboard-transfer/**
      - .github/workflows/apply-dashboard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/feat/hermes-context-engine-v0.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and apply locally tested dashboard on review branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/hermes-context-engine-v0.10.0
          git merge-base --is-ancestor 9cfdbcc91f7640fffeb0b369bb76249c37b7c9c6 HEAD
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.github/tt-dashboard-transfer')
          parts = [root / f'{i}.b64' for i in range(6)]
          assert sorted(p.name for p in root.iterdir()) == [f'{i}.b64' for i in range(6)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1da590f350b269477f19c1a84e66caed7922105de44ae937febd4bc49f657117'
          assert b'diff --git a/.github/' not in patch
          pathlib.Path('/tmp/tt-dashboard.patch').write_bytes(patch)
          PY
          git apply --check /tmp/tt-dashboard.patch
          git apply --index /tmp/tt-dashboard.patch
          git rm -r .github/tt-dashboard-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: profile token dashboard and native Hermes Desktop status popover'
          git push origin HEAD:refs/heads/feat/hermes-context-engine-v0.10.0
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
