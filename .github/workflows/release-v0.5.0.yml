name: Release v0.5.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v0.5.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'AronAxe/Token-Terminator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Confirm release version and tag state
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(PYTHONPATH=src python -c 'from rtk_hermes_plus._version import __version__; print(__version__)')"
          if [[ "$VERSION" != "0.5.0" ]]; then
            echo "Expected package version 0.5.0, got $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install release dependencies
        if: steps.release_state.outputs.exists != 'true'
        run: python -m pip install -e '.[dev]'

      - name: Verify source and tests
        if: steps.release_state.outputs.exists != 'true'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest
          python scripts/benchmark.py --skip-rtk

      - name: Build and verify distributions
        if: steps.release_state.outputs.exists != 'true'
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py 'dist/*'

      - name: Write release notes
        if: steps.release_state.outputs.exists != 'true'
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Highlights

          - Temporal delta compression for repeated large terminal observations. Commands still execute every time; the current exact output is vaulted before a smaller no-change/diff representation may be shown.
          - Model-aware token acceptance with exact Hugging Face `tokenizer.json` or tiktoken backends when available, plus character fallback, output reservation, and explicit safety headroom.
          - Deterministic layered artifact recovery through `artifact_peek` and `artifact_find`, while `artifact_get` remains the immutable exact-evidence path.
          - Lease claims are rolled back when a character-saving compiler candidate fails the tokenizer gate.
          - `native` mode remains native-only; temporal terminal deltas are confined to `balanced` and `aggressive`.

          ## Verification

          - Python 3.10, 3.11, 3.12, and 3.13 CI passed.
          - Windows CI passed.
          - 162 tests passed, 2 skipped in the release candidate matrix.
          - Ruff lint and formatting checks passed.
          - Structural benchmark, package build, Twine validation, and release-containment verification passed.
          - Post-merge CI on `main` passed before release publication.

          ## Rust / PyO3

          A native Rust accelerator remains deliberately deferred until profiling identifies a material hot path. The 0.5.0 release keeps the portable Python core and fail-open behavior intact.
          EOF

      - name: Publish GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_state.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "Token Terminator ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag=false

      - name: Existing release tag
        if: steps.release_state.outputs.exists == 'true'
        run: echo "v${{ steps.release_state.outputs.version }} already exists; nothing to publish."
