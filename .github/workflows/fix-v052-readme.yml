name: Fix v0.5.2 README

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-v052-readme.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Fix release reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'The commands below pin the immutable `v0.5.1` release tag.'
          new = 'The commands below pin the immutable `v0.5.2` release tag.'
          if old not in text:
              raise SystemExit('expected README release reference not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: fix v0.5.2 install reference"
          git push origin HEAD:main
