name: Prepare v0.6.0

on:
  push:
    branches: [v0.6.0-release]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.6.0-release
          fetch-depth: 0

      - name: Prepare release tree
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace(path, old, new, count=-1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              write(path, text)

          # SkillGate: no hard count ceiling by default. Explicit caps remain opt-in.
          replace(
              "src/rtk_hermes_plus/skillgate.py",
              '    """Route large skill catalogs down to the few entries relevant this turn.\n',
              '    """Route large skill catalogs down to the entries relevant this turn.\n',
          )
          replace(
              "src/rtk_hermes_plus/skillgate.py",
              '        max_skills: int = 4,\n',
              '        max_skills: int | None = None,\n',
          )
          replace(
              "src/rtk_hermes_plus/skillgate.py",
              '        self.max_skills = max(1, int(max_skills))\n',
              '        self.max_skills = None if max_skills is None else max(1, int(max_skills))\n',
          )
          replace(
              "src/rtk_hermes_plus/skillgate.py",
              '    The default scorer is deterministic lexical-IDF. A future tiny learned\n    reranker can be injected through ``scorer`` without changing the middleware.\n',
              '    There is no skill-count ceiling by default: every skill whose score clears\n    ``min_score`` is retained. ``max_skills`` is an explicit opt-in cap for hosts\n    with their own bounded-context requirements.\n\n    The default scorer is deterministic lexical-IDF. A future tiny learned\n    reranker can be injected through ``scorer`` without changing the middleware.\n',
          )
          replace(
              "src/rtk_hermes_plus/skillgate.py",
              '        scored.sort(key=lambda item: (-item[0], item[1]))\n        return [item[2] for item in scored[: self.max_skills]]\n',
              '        scored.sort(key=lambda item: (-item[0], item[1]))\n        selected = [item[2] for item in scored]\n        if self.max_skills is None:\n            return selected\n        return selected[: self.max_skills]\n',
          )

          tests = read("tests/test_skillgate.py")
          test_block = '''\n\ndef test_default_router_has_no_skill_count_ceiling():\n    gate = SkillGate(_Budget(), min_score=0.1)\n    gate.set_scorer(lambda _prompt, _skill: 1.0)\n    entries = gate._parse(_catalog().split("<available_skills>", 1)[1].split("</available_skills>", 1)[0])\n\n    selected = gate._select("Use every relevant skill.", entries)\n\n    assert gate.max_skills is None\n    assert len(entries) == 8\n    assert len(selected) == 8\n'''
          if "test_default_router_has_no_skill_count_ceiling" not in tests:
              write("tests/test_skillgate.py", tests + test_block)

          # Package + crate versions.
          replace("pyproject.toml", 'version = "0.5.2"', 'version = "0.6.0"', 1)
          replace("src/rtk_hermes_plus/_version.py", '__version__ = "0.5.2"', '__version__ = "0.6.0"', 1)
          replace("Cargo.toml", 'version = "0.5.2"', 'version = "0.6.0"', 1)
          for path in ("docs/RUST_CRATE.md", "wiki/Rust-Interoperability.md"):
              replace(path, 'token-terminator = "0.5.2"', 'token-terminator = "0.6.0"')

          # README current-version/install references plus v0.6 capabilities.
          readme = read("README.md")
          readme = readme.replace("v0.5.2", "v0.6.0")
          readme = readme.replace("Release v0.5.2", "Release v0.6.0")
          readme = readme.replace("release-v0.5.2", "release-v0.6.0")
          readme = readme.replace(
              "Token Terminator 0.6.0 supersedes 0.5.1",
              "Token Terminator 0.6.0 supersedes 0.5.2",
          )
          old_engine = '''The engine has five cooperating reduction paths:\n\n1. transparent terminal-command rewriting through [RTK](https://github.com/rtk-ai/rtk);\n2. temporal delta compression for repeated terminal observations, after the command has actually executed;\n3. deterministic compression of large tool results;\n4. content-addressed vaulting, duplicate collapse, evidence leases, compact recovery receipts, and deterministic layered recovery views;\n5. final provider-request compilation, with model-aware token acceptance when an exact tokenizer is available and optional bounded working-state injection only when the complete request is still smaller.\n'''
          new_engine = '''The engine has six cooperating reduction paths:\n\n1. transparent terminal-command rewriting through [RTK](https://github.com/rtk-ai/rtk);\n2. temporal delta compression for repeated terminal observations, after the command has actually executed;\n3. deterministic compression of large tool results;\n4. content-addressed vaulting, duplicate collapse, evidence leases, compact recovery receipts, and deterministic layered recovery views;\n5. SkillGate routing that keeps only prompt-relevant skill index entries while preserving on-demand discovery;\n6. final provider-request compilation, with model-aware token acceptance when an exact tokenizer is available and optional bounded working-state injection only when the complete request is still smaller.\n'''
          if old_engine not in readme:
              raise SystemExit("README engine list changed unexpectedly")
          readme = readme.replace(old_engine, new_engine)
          readme = readme.replace(
              "- **Shrinks before the model sees it.** Large tool output is compacted, repeated terminal observations can become exact-recoverable deltas, and repeated evidence is replaced with bounded receipts.\n",
              "- **Shrinks before the model sees it.** Large tool output is compacted, repeated terminal observations can become exact-recoverable deltas, and repeated evidence is replaced with bounded receipts.\n- **Routes skills before generation.** Large Hermes skill indexes are reduced to every entry that clears the relevance threshold; there is no hard skill-count cap by default, and omitted skills remain discoverable through `skills_list`/`skill_view`.\n",
          )
          readme = readme.replace(
              "- **Measures the result.** Content-free request/session telemetry separates compiler, compactor, and end-to-end savings.\n",
              "- **Measures the result.** Content-free request/session telemetry separates compiler, compactor, and end-to-end savings and attributes raw/final token cost across instructions, skill catalogs, tool schemas, tool results, the current user turn, prior history, other fields, and request framing.\n",
          )
          readme = readme.replace(
              "| Request compiler | Final provider request, after normal Hermes context assembly | ✓ |\n",
              "| SkillGate | Prompt-relevant entries from large Hermes skill indexes | on-demand discovery |\n| Request compiler | Final provider request, after normal Hermes context assembly | ✓ |\n",
          )
          readme = readme.replace(
              "| Experiment ledger | Request/session savings and mode comparison | content-free |\n",
              "| Request component attribution | Raw/final token cost by request component | content-free |\n| Experiment ledger | Request/session savings and mode comparison | content-free |\n",
          )
          readme = readme.replace(
              "When exact token measurement is available, provider-request decisions also report the tokenizer backend and raw/final/saved token counts.",
              "When exact token measurement is available, provider-request decisions also report the tokenizer backend and raw/final/saved token counts. v0.6.0 additionally persists component-level raw/final token attribution and SkillGate savings without storing prompt or skill content.",
          )
          write("README.md", readme)

          # Changelog.
          changelog = read("CHANGELOG.md")
          section = '''## 0.6.0 - 2026-09-16\n\n- Added content-free component-level request token attribution for instructions, skill catalogs, tool schemas, tool results, the current user turn, prior history, other fields, and request framing, with raw/final token and character totals.\n- Added SkillGate routing for Hermes-style `<available_skills>` indexes so irrelevant skill metadata can be removed before the expensive model sees it while omitted skills remain discoverable through `skills_list` and `skill_view`.\n- Kept SkillGate fail-open: it runs only when both discovery tools are provider-visible, never rewrites user/tool/history content, preserves caller immutability, and accepts a routed payload only when the complete request is strictly smaller.\n- Removed the default SkillGate count ceiling. Every skill above the relevance threshold is retained; `max_skills` is now an explicit opt-in host constraint rather than a Token Terminator default.\n- Added a pluggable `(prompt, skill) -> relevance` scorer boundary so a tiny trained/local reranker can replace the deterministic lexical-IDF bootstrap without changing middleware plumbing.\n- Updated Python and Rust package metadata, install docs, migration notes, and the source-controlled GitHub Wiki for v0.6.0.\n\n'''
          if "## 0.6.0 - 2026-09-16" not in changelog:
              changelog = changelog.replace("# Changelog\n\n", "# Changelog\n\n" + section, 1)
          write("CHANGELOG.md", changelog)

          # Migration guide: add an in-place 0.5.2 -> 0.6.0 section and make current commands current.
          migration = read("MIGRATION.md")
          migration = migration.replace(
              "# Migration and rollback: 0.2.0 / 0.4.0 / 0.5.0 / 0.5.1 → 0.5.2",
              "# Migration and rollback: 0.2.0 / 0.4.0 / 0.5.x → 0.6.0",
              1,
          )
          migration = migration.replace(
              "Token Terminator 0.5.2 supersedes Token Terminator 0.5.1",
              "Token Terminator 0.6.0 supersedes Token Terminator 0.5.2",
              1,
          )
          mig_section = '''## 0.5.2 → 0.6.0\n\nv0.6.0 is a normal in-place upgrade. It adds component-level request attribution and SkillGate routing. The artifact vault and content-addressed identities remain compatible; the new attribution table is additive and stores metrics only, not prompt or skill text.\n\nSkillGate has no hard skill-count ceiling by default. It retains every skill above the relevance threshold, runs only when `skills_list` and `skill_view` remain provider-visible, and passes the original request through when routing cannot be proven smaller.\n\nInstall the immutable release tag:\n\n```bash\nhermes plugins disable token-terminator\n<hermes-python> -m pip uninstall -y token-terminator\n<hermes-python> -m pip install \\\n  'git+https://github.com/AronAxe/Token-Terminator.git@v0.6.0'\nhermes plugins enable token-terminator --no-allow-tool-override\n```\n\n'''
          if "## 0.5.2 → 0.6.0" not in migration:
              migration = migration.replace("## 0.5.1 → 0.5.2\n", mig_section + "## 0.5.1 → 0.5.2\n", 1)
          migration = migration.replace("@v0.5.2", "@v0.6.0")
          migration = migration.replace("Token Terminator 0.5.2 |", "Token Terminator 0.6.0 |")
          write("MIGRATION.md", migration)

          # Wiki current state and release page.
          home = read("wiki/Home.md")
          home = home.replace("Python package/release: **v0.5.2**", "Python package/release: **v0.6.0**")
          home = home.replace("Rust interoperability crate: **token-terminator 0.5.2**", "Rust interoperability crate: **token-terminator 0.6.0**")
          home_section = '''## What v0.6.0 adds\n\nv0.6.0 prevents more prompt bloat before provider dispatch. Request attribution now shows where input tokens come from, and SkillGate reduces large Hermes `<available_skills>` indexes to the entries relevant to the current user request while keeping omitted skills discoverable on demand.\n\nSkillGate has **no hard skill-count ceiling by default**: every entry above the relevance threshold survives. The deterministic lexical-IDF scorer is the bootstrap implementation; a pluggable scorer interface is ready for a tiny learned/local reranker. Routing is fail-open and only touches trusted system/developer instruction fields.\n\n'''
          if "## What v0.6.0 adds" not in home:
              home = home.replace("## What v0.5.2 adds\n", home_section + "## What v0.5.2 adds\n", 1)
          write("wiki/Home.md", home)

          quick = read("wiki/Quick-Start.md").replace("v0.5.2", "v0.6.0").replace("0.5.2", "0.6.0")
          write("wiki/Quick-Start.md", quick)
          footer = read("wiki/_Footer.md").replace("Token Terminator v0.5.2", "Token Terminator v0.6.0")
          write("wiki/_Footer.md", footer)
          sidebar = read("wiki/_Sidebar.md")
          if "Release 0.6.0" not in sidebar:
              sidebar = sidebar.replace("- [Release 0.5.2](Release-0.5.2)", "- [Release 0.6.0](Release-0.6.0)\n- [Release 0.5.2](Release-0.5.2)", 1)
          write("wiki/_Sidebar.md", sidebar)

          wiki_mig = read("wiki/Migration-and-Rollback.md")
          if "## 0.5.2 → 0.6.0" not in wiki_mig:
              wiki_mig = wiki_mig.replace(
                  "## 0.5.1 → 0.5.2\n",
                  "## 0.5.2 → 0.6.0\n\nNormal in-place upgrade. v0.6.0 adds component-level request attribution and fail-open SkillGate routing. Existing vault content remains valid. SkillGate has no default count cap: all skills above the relevance threshold survive, while filtered skills remain available through `skills_list` and `skill_view`.\n\n## 0.5.1 → 0.5.2\n",
                  1,
              )
          write("wiki/Migration-and-Rollback.md", wiki_mig)

          release_page = '''# Release 0.6.0\n\n**Date:** 2026-09-16\n\nToken Terminator v0.6.0 adds **request component attribution** and **SkillGate**.\n\n## Highlights\n\n- Provider-bound requests are now attributed across instructions, skill catalogs, tool schemas, tool results, current-user content, history, other fields, and request framing.\n- SkillGate reduces large Hermes `<available_skills>` indexes before provider dispatch while preserving `skills_list` / `skill_view` discovery.\n- There is **no default maximum number of retained skills**. Every skill above the relevance threshold is kept; an explicit `max_skills` remains available only as an opt-in host constraint.\n- Routing touches only trusted system/developer instruction fields and leaves quoted skill tags in user/tool/history content unchanged.\n- The current lexical-IDF scorer is deterministic and dependency-free; `Runtime.set_skill_scorer(...)` is the extension point for a future tiny trained/local relevance model.\n- Raw/final component metrics are content-free and use exact tokenizer measurements when available, with the existing labelled fallback otherwise.\n\n## Compatibility\n\nThis is an in-place upgrade from v0.5.2. Existing content-addressed artifacts remain valid. The new request-attribution telemetry is additive. Python support remains 3.10–3.13. The Rust interoperability crate is released as `token-terminator` 0.6.0.\n\n## Install\n\n```bash\npython -m pip install 'git+https://github.com/AronAxe/Token-Terminator.git@v0.6.0'\n```\n\nRust:\n\n```toml\n[dependencies]\ntoken-terminator = "0.6.0"\n```\n'''
          write("wiki/Release-0.6.0.md", release_page)
          PY

          git rm .github/workflows/prepare-v060.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v0.6.0"
          git push origin HEAD:v0.6.0-release
