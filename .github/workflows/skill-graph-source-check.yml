name: Skill graph source check
on:
  push:
    branches: [feature/hierarchical-skill-graphs]
    paths: [.github/workflows/skill-graph-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git archive --format=tar.gz HEAD > source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: skill-graph-source
          path: source.tar.gz
          retention-days: 1
