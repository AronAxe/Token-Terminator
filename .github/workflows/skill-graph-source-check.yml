name: Skill graph source check
on:
  push:
    branches: [feature/hierarchical-skill-graphs]
    paths: [.github/workflows/skill-graph-source-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip download --dest wheels ruff tiktoken tokenizers build twine tomli setuptools wheel
      - uses: actions/upload-artifact@v4
        with:
          name: skill-graph-dev-wheels
          path: wheels/
          retention-days: 1
