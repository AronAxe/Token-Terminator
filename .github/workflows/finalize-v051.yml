name: Finalize v0.5.1 hardening

on:
  push:
    branches: [v0.5.1-hardening]

permissions:
  contents: write

concurrency:
  group: finalize-v051-hardening
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.1-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy

      - name: Apply final fixes
        run: python scripts/finalize_v051.py

      - name: Install Python verification dependencies
        run: python -m pip install -e '.[dev]'

      - name: Normalize and verify Python
        run: |
          python -m ruff check . --fix
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest

      - name: Verify Python distributions
        run: |
          python scripts/benchmark.py --skip-rtk
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python scripts/verify_release.py 'dist/*'

      - name: Verify Rust companion crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
          rm -f Cargo.lock
          cargo publish --dry-run --allow-dirty

      - name: Commit finalized tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finalize_v051.py .github/workflows/finalize-v051.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Token Terminator v0.5.1 hardening'
          git push origin HEAD:v0.5.1-hardening
