name: Fix v0.6.0 README

on:
  push:
    branches: [v0.6.0-release]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.6.0-release
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'Token Terminator 0.5.2 supersedes 0.5.1 and replaces the earlier `rtk-hermes-plus` distribution.'
          new = 'Token Terminator 0.6.0 supersedes 0.5.2 and replaces the earlier `rtk-hermes-plus` distribution.'
          if old not in text:
              raise SystemExit('expected README release sentence not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-v060-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align README with v0.6.0"
          git push origin HEAD:v0.6.0-release
