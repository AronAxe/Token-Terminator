name: Apply JEV role documentation correction

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths: [.github/workflows/clarify-jev-roles.yml]

permissions:
  contents: write

jobs:
  clarify:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/feat/hermes-context-engine-v0.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Correct only the reviewed documentation on the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/hermes-context-engine-v0.10.0
          python - <<'PY'
          import pathlib, subprocess
          expected = {
              'README.md': '6bc503320cbd5fbe86c79b6f84c0ad749e8e2f88',
              'docs/CALL_SCOPE_REVIEW.md': 'f3a200235c50c429bbb4b1df6c453d4235747978',
          }
          for name, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', name], text=True).strip() == sha, name
          def replace(name, old, new):
              path = pathlib.Path(name)
              text = path.read_text(encoding='utf-8')
              assert text.count(old) == 1, (name, old)
              path.write_text(text.replace(old, new), encoding='utf-8')
          replace('README.md', '## Call scope and JEV chat targets (v0.10.0 candidate)', '## Call scope and JEV decision roles (v0.10.0 candidate)')
          replace('README.md', 'When JEV is the **actual final chat model**, TT preserves supplied history by\ndefault: no automatic semantic pruning, age-collapse or SkillGate omission.',
              'JEV makes typed decisions; it is not a drop-in chat/code-generation LLM.\n'
              'It can control workflows, tools/skills, handlers, priorities and escalation,\n'
              'or support an LLM through context selection and input/output verification.\n'
              'TT currently implements the context-selection part, not a general JEV\n'
              'controller or post-answer verifier. Existing SkillGate is deterministic,\n'
              "not TypeSafe's separate two-stage skill-suggestion integration.\n"
              'Typed JEV control/verification requests bypass TT unchanged; the answering\n'
              "LLM's separately authorized conversation request can still use TT.\n\n"
              'For an **explicitly integrated conversational wrapper** identified as\n'
              'JEV-backed, the defensive target policy preserves supplied history by\n'
              'default: no automatic semantic pruning, age-collapse or SkillGate omission.\n'
              'This policy does not supply a wrapper or native JEV chat capability.')
          replace('README.md', 'See [call-scope review and limits](docs/CALL_SCOPE_REVIEW.md).',
              'See [JEV roles and implemented scope](docs/JEV_ROLES.md) and\n'
              '[call-scope review and limits](docs/CALL_SCOPE_REVIEW.md).')
          replace('docs/CALL_SCOPE_REVIEW.md', '| JEV as final chat target |', '| Explicit JEV-backed conversational wrapper |')
          replace('docs/CALL_SCOPE_REVIEW.md', '## Conservative JEV final-target policy\n',
              '## Conservative policy for an explicit JEV-backed conversational wrapper\n\n'
              '**Architecture clarification:** native JEV returns typed decisions, not\n'
              'conversational prose. This defensive policy does not add a native JEV chat\n'
              'API or implement a controller/wrapper. Typed control and verification calls\n'
              'bypass before it is considered. TT currently implements context-selection\n'
              'support, not a general workflow router or post-answer citation verifier.\n'
              'See [JEV roles and the primary documentation](JEV_ROLES.md).\n')
          PY
          python -m pip install ruff
          python -m ruff format tests/test_jev_roles.py
          python -m ruff check tests/test_jev_roles.py
          git diff --check
          git add README.md docs/CALL_SCOPE_REVIEW.md tests/test_jev_roles.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: distinguish JEV decision control from generative chat and TT context support'
          git push origin HEAD:refs/heads/feat/hermes-context-engine-v0.10.0
          git rev-parse HEAD
