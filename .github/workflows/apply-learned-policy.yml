name: Apply verified learned-policy candidate

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths:
      - .github/tt-learning-transfer/**
      - .github/workflows/apply-learned-policy.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/feat/hermes-context-engine-v0.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply locally tested source on the review branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/hermes-context-engine-v0.10.0
          git merge-base --is-ancestor bff951c3816f1bf5723337bd39bfa1a5c72d0aaa HEAD
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.github/tt-learning-transfer')
          parts = [root / f'{i}.b64' for i in range(3)]
          assert sorted(p.name for p in root.iterdir()) == ['0.b64', '1.b64', '2.b64']
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '40f5d44bdff39a99a6849a51b648a563cf5822f1bfcf46c3143f678e3354757d'
          assert b'diff --git a/.github/' not in patch
          pathlib.Path('/tmp/tt-learned-policy.patch').write_bytes(patch)
          PY
          git apply --check /tmp/tt-learned-policy.patch
          git apply --index /tmp/tt-learned-policy.patch
          git rm -r .github/tt-learning-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: learned JEV omission-risk policy and bounded feature discovery for v0.11.0'
          git push origin HEAD:refs/heads/feat/hermes-context-engine-v0.10.0
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
