name: Apply verified call-scope review

on:
  push:
    branches: [feat/hermes-context-engine-v0.10.0]
    paths:
      - .github/tt-scope-transfer/**
      - .github/workflows/apply-scope-review.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'AronAxe/Token-Terminator' && github.ref == 'refs/heads/feat/hermes-context-engine-v0.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply hash-verified locally tested patch on the review branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/hermes-context-engine-v0.10.0
          git merge-base --is-ancestor 0cfe572506fc87df4ccf54fcc9ed34757ac05b5f HEAD
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.github/tt-scope-transfer')
          parts = [root / '0.b64', root / '1.b64']
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '721fb94001d8f4aa533e6d427036853f9cdde25a151d9dde51bb63ba96536571'
          assert b'diff --git a/.github/' not in patch
          pathlib.Path('/tmp/tt-scope-review.patch').write_bytes(patch)
          PY
          git apply --check /tmp/tt-scope-review.patch
          git apply --index /tmp/tt-scope-review.patch
          git rm -r .github/tt-scope-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: authorize conversational scope before context reduction and preserve JEV chat targets'
          git push origin HEAD:refs/heads/feat/hermes-context-engine-v0.10.0
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
