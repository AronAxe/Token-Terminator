name: Publish crates.io v0.5.0

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-crates-v0.5.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'AronAxe/Token-Terminator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: rustfmt, clippy

      - name: Check whether 0.5.0 is already published
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error \
            'https://crates.io/api/v1/crates/token-terminator/0.5.0' \
            >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify crate version
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version = "0.5.0"' Cargo.toml >/dev/null

      - name: Verify Rust crate
        if: steps.registry.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
          rm -f Cargo.lock
          cargo publish --dry-run

      - name: Publish token-terminator 0.5.0
        if: steps.registry.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          token="${CARGO_REGISTRY_TOKEN:-${CRATES_IO_TOKEN:-}}"
          if [[ -z "$token" ]]; then
            echo '::error::No crates.io publishing token is configured. Add CARGO_REGISTRY_TOKEN (preferred) or CRATES_IO_TOKEN to this repository.'
            exit 1
          fi
          cargo publish --token "$token"

      - name: Already published
        if: steps.registry.outputs.exists == 'true'
        run: echo 'token-terminator 0.5.0 already exists on crates.io; publication is a no-op.'
