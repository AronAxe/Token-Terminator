# Infrastructure Hardware & Architecture Requirements Specification
# Architecture Governance Committee - Rev 2026.03
specification_version: 5.12.0
governance_board: Enterprise Architecture Guild

default_cluster_profile:
  hypervisor: KVM-Hardened
  network_bandwidth_gbps: 25
  monitoring_agent: Datadog-v8-SecurityAgent

workload_hardware_constraints:
  GEN-APP-1:
    min_vcpus: 8
    min_ram_gb: 32
    storage_type: Network-SSD
    vector_extensions: none

  FIN-PAY-4:
    min_vcpus: 32
    min_ram_gb: 128
    storage_type: Network-Provisioned-IOPS
    vector_extensions: none

  HLTH-PROD-9:
    workload_description: 'High-throughput genomic sequencing & clinical ML inference engine'
    min_vcpus: 64
    min_ram_gb: 256
    storage_type: NVMe-Direct-Attached
    nvme_direct_attached_required: true
    network_ebs_permitted: false
    vector_extensions: 'AVX-512'
    numa_nodes_max: 2
    hardware_isolation: Dedicated-Tenant-Core

  ECOMM-STORE-2:
    min_vcpus: 16
    min_ram_gb: 64
    storage_type: General-Purpose-SSD
    vector_extensions: none

