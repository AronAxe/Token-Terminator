<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Token Terminator crushes redundant tokens</title>
  <desc id="desc">A chrome endoskeleton boot crushes a pile of glowing token chips while a compact beam of useful context escapes intact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030405"/>
      <stop offset="0.55" stop-color="#0a0d11"/>
      <stop offset="1" stop-color="#130607"/>
    </linearGradient>
    <radialGradient id="redGlow">
      <stop offset="0" stop-color="#ff554d" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e50914" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5f7"/>
      <stop offset="0.14" stop-color="#68727a"/>
      <stop offset="0.34" stop-color="#181d22"/>
      <stop offset="0.55" stop-color="#b8c3c9"/>
      <stop offset="0.76" stop-color="#30373d"/>
      <stop offset="1" stop-color="#090c0f"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69737a"/>
      <stop offset="0.45" stop-color="#151a1e"/>
      <stop offset="1" stop-color="#050708"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f8ff"/>
      <stop offset="0.22" stop-color="#4de5ff"/>
      <stop offset="0.58" stop-color="#1b6c8f"/>
      <stop offset="1" stop-color="#06151e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d33" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ff3d33"/>
      <stop offset="1" stop-color="#7ef7ff"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="tokenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#86eeff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="28" fill="url(#grid)"/>
  <ellipse cx="1180" cy="500" rx="450" ry="230" fill="url(#redGlow)"/>
  <ellipse cx="1070" cy="570" rx="370" ry="38" fill="#000" opacity="0.78"/>

  <!-- Token stream entering the danger zone -->
  <g opacity="0.86" filter="url(#tokenGlow)">
    <g transform="translate(80 145)"><rect width="104" height="54" rx="10" fill="url(#token)" stroke="#83f2ff"/><text x="52" y="35" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#e8fdff">TOOL</text></g>
    <g transform="translate(220 235)"><rect width="86" height="48" rx="9" fill="url(#token)" stroke="#83f2ff"/><text x="43" y="31" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#e8fdff">LOG</text></g>
    <g transform="translate(340 130)"><rect width="112" height="56" rx="10" fill="url(#token)" stroke="#83f2ff"/><text x="56" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" fill="#e8fdff">TRACE</text></g>
    <g transform="translate(455 270)"><rect width="102" height="52" rx="10" fill="url(#token)" stroke="#83f2ff"/><text x="51" y="34" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#e8fdff">DUP</text></g>
    <g transform="translate(560 170)"><rect width="118" height="58" rx="11" fill="url(#token)" stroke="#83f2ff"/><text x="59" y="37" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700" fill="#e8fdff">CTX</text></g>
    <path d="M90 355 C300 332 480 378 760 354" fill="none" stroke="#45dff8" stroke-width="3" stroke-dasharray="4 13" opacity="0.75"/>
  </g>

  <!-- Crushed token pile -->
  <g transform="translate(760 465)" filter="url(#tokenGlow)">
    <g transform="rotate(-16)"><rect x="0" y="0" width="128" height="58" rx="10" fill="url(#token)" stroke="#8df7ff"/><path d="M62 3l-18 22 23 10-16 23" fill="none" stroke="#020608" stroke-width="6"/><text x="94" y="36" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#e8fdff">DUP</text></g>
    <g transform="translate(85 10) rotate(12)"><rect width="130" height="58" rx="10" fill="url(#token)" stroke="#8df7ff"/><path d="M55 2l20 20-24 12 18 23" fill="none" stroke="#020608" stroke-width="6"/><text x="98" y="36" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#e8fdff">RAW</text></g>
    <g transform="translate(180 22) rotate(-7)"><rect width="116" height="54" rx="10" fill="url(#token)" stroke="#8df7ff"/><path d="M46 0l15 19-22 13 19 22" fill="none" stroke="#020608" stroke-width="6"/><text x="78" y="34" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#e8fdff">NOISE</text></g>
  </g>

  <!-- Mechanical lower leg -->
  <g filter="url(#shadow)">
    <path d="M1090 -30 L1320 -30 L1280 272 L1120 306 Z" fill="url(#steelDark)" stroke="#909ba3" stroke-width="3"/>
    <path d="M1135 -10 L1212 8 L1196 273 L1125 288 Z" fill="url(#steel)" stroke="#d9e1e5" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M1240 -4 L1310 -18 L1270 255 L1208 277 Z" fill="url(#steel)" stroke="#879198" stroke-width="2"/>
    <path d="M1160 55 L1285 22 M1148 117 L1294 84 M1138 178 L1288 146 M1128 238 L1282 207" stroke="#07090b" stroke-width="13" opacity="0.7"/>
    <circle cx="1196" cy="286" r="48" fill="#11161a" stroke="#aeb8bd" stroke-width="13"/>
    <circle cx="1196" cy="286" r="17" fill="#e1181f" stroke="#ff7770" stroke-width="4" filter="url(#tokenGlow)"/>
    <!-- Pistons -->
    <path d="M1145 245 L1035 385" stroke="#a8b3b8" stroke-width="17"/>
    <path d="M1151 250 L1040 391" stroke="#20262b" stroke-width="8"/>
    <path d="M1250 250 L1324 392" stroke="#a8b3b8" stroke-width="17"/>
    <path d="M1245 253 L1319 395" stroke="#20262b" stroke-width="8"/>
    <!-- Foot chassis -->
    <path d="M1070 320 C1135 310 1225 330 1287 370 L1450 470 C1479 489 1466 536 1426 543 L960 550 C906 550 875 514 906 472 L1017 354 C1031 338 1048 326 1070 320 Z" fill="url(#steel)" stroke="#c6d0d4" stroke-width="4"/>
    <path d="M1018 355 C1090 374 1195 400 1280 464 L1398 523 L976 530 C943 530 928 510 947 487 Z" fill="#12171b" stroke="#5c656b" stroke-width="3"/>
    <path d="M1162 343 L1114 485 M1240 369 L1204 507 M1323 421 L1297 520" stroke="#050708" stroke-width="16" opacity="0.7"/>
    <path d="M948 488 C1080 500 1260 524 1424 510" fill="none" stroke="#e7eef0" stroke-opacity="0.48" stroke-width="4"/>
    <path d="M958 551 H1425" stroke="#000" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Sparks and shattered token fragments -->
  <g fill="#ff443b" filter="url(#tokenGlow)">
    <path d="M920 510 l-70 -42 46 72 z"/><path d="M1010 523 l-23 82 61-68 z"/><path d="M1110 528 l28 64 18-70 z"/><path d="M1284 526 l72 48-35-68 z"/>
    <circle cx="876" cy="452" r="6"/><circle cx="852" cy="430" r="3"/><circle cx="1040" cy="594" r="5"/><circle cx="1360" cy="580" r="4"/>
  </g>
  <g stroke="#ff4a42" stroke-linecap="round" filter="url(#tokenGlow)">
    <path d="M900 493 l-92 -83 M974 512 l-30 -112 M1056 522 l34 -105 M1288 520 l89 -78" stroke-width="4"/>
    <path d="M887 500 l-50 -10 M1002 518 l-13 58 M1190 524 l28 56 M1350 519 l68 9" stroke-width="2"/>
  </g>

  <!-- Useful context survives as a compact beam -->
  <path d="M84 401 C370 401 600 408 820 468" fill="none" stroke="url(#beam)" stroke-width="3" opacity="0.75"/>
  <path d="M117 422 C402 418 612 425 810 478" fill="none" stroke="#7ef7ff" stroke-width="1" stroke-dasharray="7 9" opacity="0.8"/>
  <g transform="translate(120 454)">
    <rect width="310" height="58" rx="29" fill="#07161b" stroke="#72eef8" stroke-width="2"/>
    <circle cx="33" cy="29" r="11" fill="#73f2ff" filter="url(#tokenGlow)"/>
    <text x="60" y="36" font-family="ui-monospace,monospace" font-size="19" font-weight="700" letter-spacing="2" fill="#dffcff">EVIDENCE PRESERVED</text>
  </g>

  <text x="92" y="82" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#ff4239">JUDGMENT DAY FOR TOKEN BLOAT</text>
  <text x="92" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500" letter-spacing="1.4" fill="#86939d">FAIL OPEN · RECOVER EXACTLY · SEND LESS</text>
  <rect x="0" y="0" width="1600" height="640" rx="28" fill="none" stroke="#39434a" stroke-width="2"/>
</svg>
