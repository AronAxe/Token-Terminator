    <g transform="translate(92 8) rotate(9)"><rect width="110" height="64" rx="10" fill="url(#cyan)" stroke="#9af6ff" stroke-width="3"/><path d="M52 2l-18 23 25 12-18 26" fill="none" stroke="#05090b" stroke-width="7"/></g>
    <g transform="translate(187 4) rotate(-6)"><rect width="108" height="64" rx="10" fill="url(#cyan)" stroke="#9af6ff" stroke-width="3"/><path d="M47 2l20 22-25 14 21 24" fill="none" stroke="#05090b" stroke-width="7"/></g>
  </g>
