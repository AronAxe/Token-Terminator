    <radialGradient id="bg"><stop offset="0" stop-color="#181d21"/><stop offset="1" stop-color="#030405"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8f9"/><stop offset=".22" stop-color="#515b62"/><stop offset=".48" stop-color="#14191d"/><stop offset=".68" stop-color="#b7c2c7"/><stop offset="1" stop-color="#0a0d0f"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7fbff"/><stop offset=".3" stop-color="#39dbf5"/><stop offset="1" stop-color="#073244"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#ef2b25" stroke-width="12" opacity=".85"/>
  <circle cx="256" cy="256" r="174" fill="none" stroke="#ef2b25" stroke-width="2" stroke-dasharray="12 18" opacity=".65"/>
  <path d="M256 38v44M256 430v44M38 256h44M430 256h44" stroke="#ef2b25" stroke-width="9"/>
  <g transform="translate(86 333)" filter="url(#glow)">
