<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Token Terminator mark</title>
  <desc id="desc">A chrome mechanical heel crushes three glowing token chips inside a red targeting ring.</desc>
