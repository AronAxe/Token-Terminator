<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Token Terminator architecture</title>
  <desc id="desc">Token Terminator reduces terminal commands, native tool results, and final provider requests while preserving exact artifacts in one private vault and leaving LCM as Hermes' context engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#11152c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23d5ff"/>
      <stop offset="1" stop-color="#7868ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#42d7ff"/>
    </marker>
    <style>
      .heading { font: 700 28px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #f5f7ff; }
      .subheading { font: 500 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #aab4d0; }
      .lane { font: 700 15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #7ee8ff; letter-spacing: 1px; }
      .box-title { font: 700 16px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #f4f6ff; }
      .box-sub { font: 400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #aab4d0; }
      .small { font: 600 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; fill: #9aa8c8; }
      .box { fill: #111c31; stroke: #334262; stroke-width: 1.4; }
      .key { fill: #121f38; stroke: url(#accent); stroke-width: 2; }
      .gate { fill: #16243a; stroke: #42d7ff; stroke-width: 1.8; stroke-dasharray: 6 4; }
      .flow { fill: none; stroke: #42d7ff; stroke-width: 2.2; marker-end: url(#arrow); }
      .private { fill: none; stroke: #8a7cff; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <path d="M0 94 H1200" stroke="#27334d"/>
  <text x="48" y="48" class="heading">Token Terminator</text>
  <text x="48" y="73" class="subheading">Three reduction paths · one private data boundary · exact recovery · fail open</text>
  <text x="1150" y="52" text-anchor="end" class="small">LCM remains Hermes' context engine</text>

  <text x="48" y="130" class="lane">1 · TERMINAL COMMAND PATH</text>
  <rect x="48" y="148" width="210" height="86" rx="14" class="box"/>
  <text x="68" y="181" class="box-title">Hermes terminal call</text>
  <text x="68" y="204" class="box-sub">caller arguments preserved</text>
  <path d="M258 191 H318" class="flow"/>
  <rect x="320" y="148" width="210" height="86" rx="14" class="key"/>
  <text x="340" y="181" class="box-title">RTK rewrite gate</text>
  <text x="340" y="204" class="box-sub">backend · cache · timeout · guard</text>
  <path d="M530 191 H590" class="flow"/>
  <rect x="592" y="148" width="210" height="86" rx="14" class="box"/>
  <text x="612" y="181" class="box-title">Hermes executes</text>
  <text x="612" y="204" class="box-sub">safe equivalent or original command</text>
  <path d="M802 191 H862" class="flow"/>
  <rect x="864" y="148" width="288" height="86" rx="14" class="key"/>
  <text x="884" y="181" class="box-title">Smaller terminal result</text>
  <text x="884" y="204" class="box-sub">no extra provider turn</text>

  <text x="48" y="286" class="lane">2 · NATIVE EVIDENCE PATH</text>
  <rect x="48" y="304" width="210" height="98" rx="14" class="box"/>
  <text x="68" y="339" class="box-title">Large native result</text>
  <text x="68" y="362" class="box-sub">search_files · process</text>
  <text x="68" y="381" class="box-sub">read_file in aggressive mode</text>
  <path d="M258 353 H318" class="flow"/>
  <rect x="320" y="304" width="210" height="98" rx="14" class="key"/>
  <text x="340" y="339" class="box-title">Exact artifact vault</text>
  <text x="340" y="362" class="box-sub">content address + read-back check</text>
  <text x="340" y="381" class="box-sub">private SQLite provenance</text>
  <path d="M530 353 H590" class="flow"/>
  <rect x="592" y="304" width="210" height="98" rx="14" class="box"/>
  <text x="612" y="339" class="box-title">Deterministic compact</text>
  <text x="612" y="362" class="box-sub">collapse repeats · retain signal</text>
  <text x="612" y="381" class="box-sub">reject unless strictly smaller</text>
  <path d="M802 353 H862" class="flow"/>
  <rect x="864" y="304" width="288" height="98" rx="14" class="key"/>
  <text x="884" y="339" class="box-title">Compact result + receipt</text>
  <text x="884" y="362" class="box-sub">token_terminator recovers exact pages</text>
  <text x="884" y="381" class="box-sub">failure → original result</text>

  <text x="48" y="454" class="lane">3 · FINAL PROVIDER REQUEST PATH</text>
  <rect x="48" y="472" width="210" height="98" rx="14" class="box"/>
  <text x="68" y="507" class="box-title">Hermes + LCM request</text>
  <text x="68" y="530" class="box-sub">normal context already assembled</text>
  <text x="68" y="549" class="box-sub">transcript remains host-owned</text>
  <path d="M258 521 H318" class="flow"/>
  <rect x="320" y="472" width="210" height="98" rx="14" class="key"/>
  <text x="340" y="507" class="box-title">Request compiler</text>
  <text x="340" y="530" class="box-sub">deep copy · evidence leases</text>
  <text x="340" y="549" class="box-sub">duplicate receipts</text>
  <path d="M530 521 H590" class="flow"/>
  <rect x="592" y="472" width="210" height="98" rx="14" class="box"/>
  <text x="612" y="507" class="box-title">Optional working state</text>
  <text x="612" y="530" class="box-sub">bounded · disabled by default</text>
  <text x="612" y="549" class="box-sub">never a second context engine</text>
  <path d="M802 521 H862" class="flow"/>
  <rect x="864" y="472" width="288" height="98" rx="14" class="gate"/>
  <text x="884" y="507" class="box-title">Complete-size acceptance gate</text>
  <text x="884" y="530" class="box-sub">count receipts + working state</text>
  <text x="884" y="549" class="box-sub">smaller → provider · else pass through</text>

  <rect x="48" y="612" width="1104" height="50" rx="13" fill="#0e1a2c" stroke="#5f53a8" stroke-width="1.5"/>
  <text x="70" y="642" class="box-title">Private boundary</text>
  <text x="212" y="642" class="box-sub">artifacts · provenance · exposure leases · request metrics · optional working state · experiment ledger</text>
</svg>
