<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc">
<title id="title">Token Terminator v0.11.0 — two modes, one context owner</title><desc id="desc">Scope authorization precedes conversational reduction. Middleware mode retains the host engine. ContextEngine mode starts from full available history, uses exact vault backing, bounded JEV attention and an optional learned omission veto. Context IR and full-request acceptance precede the provider. Internal services bypass. Read-only accounting feeds localhost and Desktop. This is a logical overview, not literal hook execution order.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f1b"/><stop offset="1" stop-color="#111b2c"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#64dedc"/><stop offset="1" stop-color="#a38df6"/></linearGradient>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64dedc" stroke-width="1.6"/></marker>
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .title{fill:#f4f7fd;font-size:34px;font-weight:750}.subtitle{fill:#b0bfd5;font-size:18px}
    .label{fill:#64dedc;font-size:15px;font-weight:700;letter-spacing:1.4px}
    .name{fill:#f4f7fd;font-size:22px;font-weight:650}.body{fill:#b0bfd5;font-size:17px}
    .small{fill:#b0bfd5;font-size:15px}.pill{fill:#e1d8fe;font-size:16px;font-weight:650}
    .box{fill:#121e30;stroke:#344560;stroke-width:1.5}.key{fill:#122536;stroke:#64dedc;stroke-width:1.7}
    .optional{fill:#211e38;stroke:#a38df6;stroke-width:1.5}.bypass{fill:#20252d;stroke:#8190a4;stroke-width:1.5}
    .flow{fill:none;stroke:#64dedc;stroke-width:2;marker-end:url(#arrow)}
    .dashed{fill:none;stroke:#8f9eb4;stroke-width:1.5;stroke-dasharray:5 5}
  </style>
</defs>
<rect width="1120" height="1100" rx="24" fill="url(#bg)"/>
<rect x="40" y="34" width="48" height="4" rx="2" fill="url(#accent)"/>
<text x="40" y="83" class="title">Context, without the excess.</text>
<text x="40" y="115" class="subtitle">v0.11.0  /  Two integration modes. Exact evidence. Purpose before reduction.</text>
<text x="40" y="159" class="label">01  AUTHORIZE THE CALL</text>
<rect x="40" y="178" width="492" height="98" rx="13" class="key"/>
<text x="60" y="211" class="name">Main conversational generation</text>
<text x="60" y="238" class="body">Host purpose / role + supported hook contract</text>
<rect x="576" y="178" width="504" height="98" rx="13" class="bypass"/>
<text x="596" y="211" class="name">Internal services bypass TT</text>
<text x="596" y="238" class="body">Embeddings · reranking · helpers · internal JEV</text>
<text x="596" y="264" class="small">Tokenizers measure; they are not generation targets.</text>
<path d="M532 227 H551 V318 H286 M551 318 H828" fill="none" stroke="#64dedc" stroke-width="2"/>
<text x="40" y="310" class="label">02  SELECT EXACTLY ONE CONTEXT OWNER</text>
<rect x="40" y="330" width="492" height="94" rx="13" class="box"/>
<text x="60" y="363" class="name">Middleware mode</text>
<text x="60" y="390" class="body">Host context engine &gt; assembled context</text>
<rect x="576" y="330" width="504" height="94" rx="13" class="key"/>
<text x="596" y="363" class="name">Token Terminator ContextEngine</text>
<text x="596" y="390" class="body">Full available history &gt; exact pinned vault</text>
<path d="M286 318 V326" class="flow"/>
<path d="M828 318 V326" class="flow"/>
<path d="M286 424 V450" class="flow"/>
<path d="M828 424 V450" class="flow"/>
<rect x="40" y="462" width="492" height="123" rx="13" class="box"/>
<text x="60" y="495" class="name">Existing TT reduction</text>
<text x="60" y="522" class="body">Compiler / deterministic compaction / SkillGate</text>
<text x="60" y="546" class="body">Optional JEV gate follows local reduction</text>
<rect x="576" y="462" width="504" height="123" rx="13" class="optional"/>
<text x="596" y="495" class="name">JEV attention + safe retention</text>
<text x="596" y="522" class="body">Batched relevance / guard / salience</text>
<text x="596" y="546" class="body">Optional learned veto can keep more evidence</text>
<path d="M286 585 V619" class="flow"/>
<path d="M828 585 V619" class="flow"/>
<rect x="40" y="630" width="492" height="106" rx="13" class="optional"/>
<text x="60" y="663" class="name">Context IR · optional</text>
<text x="60" y="690" class="body">Compact exact records or reversible spans</text>
<text x="60" y="714" class="body">No invented relations; source-linked recovery</text>
<rect x="576" y="630" width="504" height="106" rx="13" class="box"/>
<text x="596" y="663" class="name">Existing TT mechanisms + IR</text>
<text x="596" y="690" class="body">Compiler / SkillGate / exact tool evidence</text>
<text x="596" y="714" class="body">No duplicate JEV gate or lossy age-collapse</text>
<text x="40" y="773" class="label">03  ACCEPT ONLY A SMALLER COMPLETE REQUEST</text>
<path d="M286 736 V747 H557 M828 736 V747 H557" fill="none" stroke="#64dedc" stroke-width="2"/>
<path d="M557 747 V791" class="flow"/>
<rect x="40" y="801" width="740" height="110" rx="13" class="key"/>
<text x="60" y="834" class="name">Full-request gate &gt; existing provider client</text>
<text x="60" y="861" class="body">Measure tools, receipts and IR against the actual target tokenizer.</text>
<text x="60" y="885" class="body">Unsafe or unsupported &gt; original request. Caller objects stay intact.</text>
<rect x="804" y="801" width="276" height="110" rx="13" class="box"/>
<text x="824" y="834" class="name">Exact recovery</text>
<text x="824" y="861" class="body">Pinned evidence / hashes</text>
<text x="824" y="885" class="body">Session find / get</text>
<text x="40" y="941" class="small">IR + ContextEngine require exact token AND character savings; legacy middleware can use its character gate.</text>
<text x="40" y="965" class="small">Counts are canonical request JSON, not provider billing. Protected-history overflow still needs host enforcement.</text>
<rect x="40" y="993" width="1040" height="77" rx="13" class="box"/>
<text x="60" y="1024" class="label">READ-ONLY OBSERVABILITY</text>
<text x="60" y="1050" class="body">Per-profile input / output ledger &gt; localhost:7474 dashboard + Hermes Desktop status-bar popover</text>
</svg>
